<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment #1 - Conversion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="index.html">HOME</a>
  <a href="assignment1.html">Assignment #1</a>
  <a href="assignment2.html">Assignment #2</a>
  <a href="assignment3.html">Assignment #3</a>
  <a href="assignment4.html">Assignment #4</a>
</nav>
<main>
  <h1>Assignment #1</h1>
  <p class="sub">Conversion</p>
  <div class="card">
    <label for="value">Value</label>
    <input type="number" id="value" step="any" placeholder="Enter a number">
    <label for="type">Conversion</label>
    <select id="type">
      <option value="c2f">Celsius to Fahrenheit</option>
      <option value="f2c">Fahrenheit to Celsius</option>
      <option value="m2ft">Meters to Feet</option>
      <option value="ft2m">Feet to Meters</option>
    </select>
    <button onclick="convert()">Convert</button>
    <div class="result" id="result"></div>
  </div>
</main>
<script>
function convert() {
  var v = parseFloat(document.getElementById("value").value);
  var t = document.getElementById("type").value;
  var out = document.getElementById("result");
  if (isNaN(v)) { out.textContent = "Please enter a valid number."; return; }
  var r;
  if (t === "c2f") r = v + " °C = " + (v * 9 / 5 + 32).toFixed(2) + " °F";
  else if (t === "f2c") r = v + " °F = " + ((v - 32) * 5 / 9).toFixed(2) + " °C";
  else if (t === "m2ft") r = v + " m = " + (v * 3.28084).toFixed(2) + " ft";
  else r = v + " ft = " + (v / 3.28084).toFixed(2) + " m";
  out.textContent = r;
}
</script>
</body>
</html>
